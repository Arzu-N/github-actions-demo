name: Backend-ci-cd
on: 
 push:
  branches:
   -main
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - name: Checkout project
     uses: actions/checkout@v4
   - name: Setup Java
     uses: actions/setup-java@v4
     with:
      java-version: '21'
      distribution: 'temurin'
   - name: Make gradlew executable
     run: chmod +x gradlew
   - name: Run tests
     run: ./gradlew test
   - name: Build project
     run: ./gradlew build
   - name: Login github
     uses: docker/login-action@v3
   - name: Build Docker Image
     run: docker build -t arzuu1/github-actions-demo .
   - name: Push docker image
     run: docker push arzuu1/github-actions-demo

 deploy:
  needs: build
  runs-on: ubuntu-latest
  steps:
   - name: Trigger Render deploy
     run: curl -X POST ${{secrets.RENDER_DEPLOY_HOOK}}
